format_version = 2

# The `[apps.<name>]` key is the app name: it names `<name>.app` and the executable
# inside it. Scripts read it (and `identifier`) via scripts/lib/app-config.sh;
# Swift mirrors both in `AppIdentity` (Constants.swift), checked by AppIdentityTests.
[apps.SidebArc]
identifier = 'io.github.giannirondini.sidebarc'
product = 'sidebarc'
version = '1.1.0'
description = 'A bookmark sidebar for macOS, organised in Spaces'
license = 'MIT'
category = 'public.app-category.productivity'
icon = 'Resources/AppIcon.png'
# Minimum macOS comes from `platforms` in Package.swift (swift-bundler v3 has no
# `minimum_macos_version` key and rejects it).

# Keys merged into Info.plist. swift-bundler doesn't always merge them, so the
# scripts also set them (`patch_info_plist` in scripts/lib/app-config.sh).
[apps.SidebArc.plist]
# Without it macOS denies Apple Events silently, without a prompt (tab focus).
NSAppleEventsUsageDescription = 'SidebArc looks for a browser tab you already have open, so clicking a favorite focuses it instead of opening a duplicate.'
